<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer Hexagon Clip Path: 4px padding top and bottom -->
    <clipPath id="assureHexClip">
      <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" />
    </clipPath>

    <!-- Deep Regal Navy Radial Background -->
    <radialGradient id="assureBg" cx="100" cy="100" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1635" />
      <stop offset="45%" stop-color="#100b24" />
      <stop offset="80%" stop-color="#080514" />
      <stop offset="100%" stop-color="#030208" />
    </radialGradient>

    <!-- Hexagon Outer Rim Gradient (Polished Gold, Amber, Bronze, Rose) -->
    <linearGradient id="assureRim" x1="16.86" y1="4" x2="183.14" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Heraldic Shield Gradients -->
    <linearGradient id="shieldLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="shieldRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Radiant Sunburst Gradient -->
    <radialGradient id="sunburstGrad" cx="100" cy="95" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#fde047" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Triad Rings Gradients -->
    <linearGradient id="triadGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="receiptEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="assureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- 80% Grayscale Filter (keeping 20% color blend) -->
    <filter id="grayscale80" x="0%" y="0%" width="100%" height="100%">
      <feColorMatrix type="saturate" values="0.2" />
    </filter>
  </defs>

  <!-- Hexagon Container -->
  <g clip-path="url(#assureHexClip)">
    <g filter="url(#grayscale80)">
    <!-- Base Background -->
    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="url(#assureBg)" />

    <!-- Radiant Verification Sunburst Rays -->
    <circle cx="100" cy="95" r="45" fill="url(#sunburstGrad)" />
    <g stroke="#fde047" stroke-width="0.8" opacity="0.35">
      <line x1="100" y1="35" x2="100" y2="155" />
      <line x1="40" y1="95" x2="160" y2="95" />
      <line x1="58" y1="53" x2="142" y2="137" />
      <line x1="58" y1="137" x2="142" y2="53" />
      <line x1="77" y1="40" x2="123" y2="150" />
      <line x1="123" y1="40" x2="77" y2="150" />
    </g>

    <!-- Concentric Filigree Verification Rings -->
    <circle cx="100" cy="95" r="72" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.4" />
    <circle cx="100" cy="95" r="60" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.5" />

    <!-- Balanced Scales / Arch of Obligation & Assumption -->
    <path d="M 52,118 Q 100,48 148,118" fill="none" stroke="url(#assureRim)" stroke-width="2.5" opacity="0.85" filter="url(#assureGlow)" />
    <!-- Scale Bowls / Balancing Anchors -->
    <ellipse cx="52" cy="120" rx="14" ry="4" fill="#78350f" stroke="#fde047" stroke-width="1" />
    <ellipse cx="148" cy="120" rx="14" ry="4" fill="#78350f" stroke="#fde047" stroke-width="1" />
    <line x1="52" y1="118" x2="52" y2="128" stroke="#f59e0b" stroke-width="1" />
    <line x1="148" y1="118" x2="148" y2="128" stroke="#f59e0b" stroke-width="1" />

    <!-- Central Heraldic Assurance Shield -->
    <g filter="url(#sealShadow)">
      <!-- Left Shield Half -->
      <path d="M 100,52 L 68,64 L 68,104 Q 68,138 100,154 Z" fill="url(#shieldLeft)" />
      <!-- Right Shield Half -->
      <path d="M 100,52 L 132,64 L 132,104 Q 132,138 100,154 Z" fill="url(#shieldRight)" />
    </g>

    <!-- Shield Border & Center Line -->
    <path d="M 100,52 L 68,64 L 68,104 Q 68,138 100,154 Q 132,138 132,104 L 132,64 Z"
          fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.85" />
    <line x1="100" y1="52" x2="100" y2="154" stroke="#ffffff" stroke-width="1" opacity="0.7" />

    <!-- Inner Shield Verification Triquetra / Security Knot -->
    <g filter="url(#assureGlow)">
      <!-- Top Ring: Human Attestation -->
      <circle cx="100" cy="84" r="13" fill="none" stroke="url(#triadGold)" stroke-width="2.2" opacity="0.95" />
      <!-- Left Ring: Behavioral Evidence -->
      <circle cx="91" cy="100" r="13" fill="none" stroke="url(#receiptEmerald)" stroke-width="2.2" opacity="0.9" />
      <!-- Right Ring: Formal Obligation Receipt -->
      <circle cx="109" cy="100" r="13" fill="none" stroke="url(#triadGold)" stroke-width="2.2" opacity="0.95" />
    </g>

    <!-- Radiant Center Audit Jewel -->
    <circle cx="100" cy="95" r="5.5" fill="#ffffff" filter="url(#assureGlow)" />
    <polygon points="100,86 102.5,93 109,95 102.5,97 100,104 97.5,97 91,95 97.5,93" fill="#fef08a" />

    <!-- Apex Keystone (Approved Status Crown) -->
    <polygon points="100,42 107,51 100,48 93,51" fill="#fef08a" stroke="#d97706" stroke-width="0.8" filter="url(#assureGlow)" />

    <!-- Receipt Seal Ribbon Tails at Base -->
    <polygon points="88,150 82,176 94,168 100,154" fill="#b45309" stroke="#f59e0b" stroke-width="0.8" />
    <polygon points="112,150 118,176 106,168 100,154" fill="#92400e" stroke="#f59e0b" stroke-width="0.8" />

    <!-- Polished Inner Bezel Border -->
    <polygon points="100,5.5 181.84,52.8 181.84,147.2 100,194.5 18.16,147.2 18.16,52.8"
             fill="none" stroke="url(#assureRim)" stroke-width="2.5" opacity="0.9" />

    <!-- Sharp Outer Metallic Hex Rim -->
    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52"
             fill="none" stroke="url(#assureRim)" stroke-width="3" />
    </g>
  </g>
</svg>