<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Outer Hexagon Clip Path: 4px padding top and bottom -->
    <clipPath id="bcHexClip">
      <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" />
    </clipPath>

    <!-- Deep Space Indigo/Violet Radial Background -->
    <radialGradient id="bcBg" cx="100" cy="100" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18133b" />
      <stop offset="45%" stop-color="#0e0a24" />
      <stop offset="85%" stop-color="#060412" />
      <stop offset="100%" stop-color="#020108" />
    </radialGradient>

    <!-- Hexagon Outer Rim Gradient (Cyan, Violet, Amber, Electric Rose) -->
    <linearGradient id="bcRim" x1="16.86" y1="4" x2="183.14" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="30%" stop-color="#7928ca" />
      <stop offset="70%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Vertical BEAM Ray Gradient -->
    <linearGradient id="bcBeamRay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.75" />
    </linearGradient>

    <!-- Compass Caliper Gradient -->
    <linearGradient id="caliperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="needleGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <filter id="bcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softRay" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 80% Grayscale Filter (keeping 20% color blend) -->
    <filter id="grayscale80" x="0%" y="0%" width="100%" height="100%">
      <feColorMatrix type="saturate" values="0.2" />
    </filter>
  </defs>

  <!-- Hexagon Container -->
  <g clip-path="url(#bcHexClip)">
    <g filter="url(#grayscale80)">
    <!-- Base Background -->
    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="url(#bcBg)" />

    <!-- Astrolabe Polar Coordinate Web -->
    <g stroke="#3b427b" stroke-width="0.6" opacity="0.4" stroke-dasharray="2,3">
      <circle cx="100" cy="100" r="76" fill="none" />
      <circle cx="100" cy="100" r="56" fill="none" />
      <circle cx="100" cy="100" r="36" fill="none" />
      <circle cx="100" cy="100" r="16" fill="none" />
      <line x1="100" y1="20" x2="100" y2="180" />
      <line x1="20" y1="100" x2="180" y2="100" />
      <line x1="43.43" y1="43.43" x2="156.57" y2="156.57" />
      <line x1="43.43" y1="156.57" x2="156.57" y2="43.43" />
    </g>

    <!-- Vertical BEAM Navigation Ray -->
    <polygon points="97,4 103,4 106,196 94,196" fill="url(#bcBeamRay)" opacity="0.7" filter="url(#softRay)" />

    <!-- Degree Tick Marks around Astrolabe Dial -->
    <g stroke="#00f5ff" stroke-width="0.8" opacity="0.6">
      <line x1="100" y1="24" x2="100" y2="29" />
      <line x1="126" y1="31" x2="124" y2="36" />
      <line x1="149" y1="50" x2="145" y2="53" />
      <line x1="165" y1="74" x2="160" y2="76" />
      <line x1="171" y1="100" x2="166" y2="100" />
      <line x1="165" y1="126" x2="160" y2="124" />
      <line x1="149" y1="150" x2="145" y2="147" />
      <line x1="126" y1="169" x2="124" y2="164" />
      <line x1="100" y1="176" x2="100" y2="171" />
      <line x1="74" y1="169" x2="76" y2="164" />
      <line x1="51" y1="150" x2="55" y2="147" />
      <line x1="35" y1="126" x2="40" y2="124" />
      <line x1="29" y1="100" x2="34" y2="100" />
      <line x1="35" y1="74" x2="40" y2="76" />
      <line x1="51" y1="50" x2="55" y2="53" />
      <line x1="74" y1="31" x2="76" y2="36" />
    </g>

    <!-- Source Fact AST Constellation Network -->
    <!-- Nodes -->
    <g filter="url(#bcGlow)">
      <!-- Intent Capsule Node -->
      <circle cx="68" cy="72" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="0.8" />
      <!-- Effect Site Node -->
      <circle cx="136" cy="64" r="3.5" fill="#06b6d4" stroke="#ffffff" stroke-width="0.8" />
      <!-- Handler Entity Node -->
      <circle cx="144" cy="132" r="3" fill="#a855f7" stroke="#ffffff" stroke-width="0.8" />
      <!-- Anchor Point Node -->
      <circle cx="60" cy="128" r="3" fill="#ec4899" stroke="#ffffff" stroke-width="0.8" />
    </g>

    <!-- Constellation Connecting Vectors -->
    <g stroke="#93c5fd" stroke-width="0.9" opacity="0.5" stroke-dasharray="3,2">
      <line x1="68" y1="72" x2="100" y2="100" />
      <line x1="136" y1="64" x2="100" y2="100" />
      <line x1="144" y1="132" x2="100" y2="100" />
      <line x1="60" y1="128" x2="100" y2="100" />
      <line x1="68" y1="72" x2="136" y2="64" />
      <line x1="136" y1="64" x2="144" y2="132" />
    </g>

    <!-- Beam Compass Calipers & Navigational Needle -->
    <!-- Caliper Arms extending from Center -->
    <g filter="url(#bcGlow)">
      <!-- North-West Caliper Leg -->
      <polygon points="98,98 100,94 66,42 63,44" fill="url(#caliperGrad)" />
      <!-- North-East Caliper Leg -->
      <polygon points="102,98 100,94 134,42 137,44" fill="url(#caliperGrad)" />
      <!-- Measurement Arc between Calipers -->
      <path d="M 68,48 A 48,48 0 0,1 132,48" fill="none" stroke="#fcd34d" stroke-width="1.8" stroke-dasharray="2,3" />
      <!-- Precision Pointer Needle (South-East vector) -->
      <polygon points="97,97 103,103 148,148 144,152" fill="url(#needleGold)" />
    </g>

    <!-- Central Gyroscope Pivot & Navigational Reticle -->
    <circle cx="100" cy="100" r="14" fill="#0f172a" stroke="#00f5ff" stroke-width="1.5" />
    <circle cx="100" cy="100" r="9" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="100" cy="100" r="4" fill="#ffffff" filter="url(#bcGlow)" />

    <!-- Crosshair Reticle -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.9">
      <line x1="100" y1="88" x2="100" y2="94" />
      <line x1="100" y1="106" x2="100" y2="112" />
      <line x1="88" y1="100" x2="94" y2="100" />
      <line x1="106" y1="100" x2="112" y2="100" />
    </g>

    <!-- Source Coordinate Indicators (Start line/col brackets) -->
    <g stroke="#00f5ff" stroke-width="1" fill="none" opacity="0.7">
      <path d="M 60,65 L 56,65 L 56,76 L 60,76" />
      <path d="M 144,57 L 148,57 L 148,68 L 144,68" />
    </g>

    <!-- Polished Inner Bezel Border -->
    <polygon points="100,5.5 181.84,52.8 181.84,147.2 100,194.5 18.16,147.2 18.16,52.8"
             fill="none" stroke="url(#bcRim)" stroke-width="2.5" opacity="0.9" />

    <!-- Sharp Outer Metallic Hex Rim -->
    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52"
             fill="none" stroke="url(#bcRim)" stroke-width="3" />
    </g>
  </g>
</svg>